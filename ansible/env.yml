---
# Pushes backend and Mini App production secrets from the ansible-vault
# encrypted group_vars/novanet/vault.yml onto the Droplet.
#
# Setup (one-time): see group_vars/novanet/vault.yml.example.
#
# Run:
#   ansible-playbook env.yml --ask-vault-pass
#
- name: Push production secrets from Ansible Vault
  hosts: novanet
  become: true

  tasks:
    - name: Fail with a clear message if vault vars are not loaded
      fail:
        msg: >
          vault_backend_env_production is not defined. Create
          group_vars/novanet/vault.yml from vault.yml.example and encrypt it
          with `ansible-vault encrypt group_vars/novanet/vault.yml`, then
          re-run this playbook with --ask-vault-pass.
      when: vault_backend_env_production is not defined or
        vault_miniapp_env_production is not defined

    - name: Ensure backend directory exists
      file:
        path: /var/www/novanet/backend
        state: directory
        mode: '0755'

    - name: Write backend .env.production
      copy:
        content: "{{ vault_backend_env_production }}"
        dest: /var/www/novanet/backend/.env.production
        mode: '0600'

    - name: Ensure Mini App source directory exists
      file:
        path: /var/www/novanet/miniapp-source
        state: directory
        mode: '0755'

    - name: Write Mini App .env.production
      copy:
        content: "{{ vault_miniapp_env_production }}"
        dest: /var/www/novanet/miniapp-source/.env.production
        mode: '0600'
