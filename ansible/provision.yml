---
- name: Provision novanet server
  hosts: novanet
  become: true

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install base packages
      apt:
        name:
          - git
          - curl
          - rsync
          - ufw
          - software-properties-common
        state: present

    - name: Add NodeSource GPG key
      shell: |
        curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key \
          | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
      args:
        creates: /etc/apt/keyrings/nodesource.gpg

    - name: Add NodeSource Node.js 22 repository
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_22.x nodistro main"
        state: present
        filename: nodesource

    - name: Install Node.js 22
      apt:
        name: nodejs
        state: present
        update_cache: yes

    - name: Install PM2 globally
      npm:
        name: pm2
        global: yes
        state: present

    - name: Install nginx
      apt:
        name: nginx
        state: present

    - name: Install certbot and nginx plugin
      apt:
        name:
          - certbot
          - python3-certbot-nginx
        state: present

    - name: Create backend directory
      file:
        path: /var/www/novanet/backend
        state: directory
        mode: '0755'

    - name: Create miniapp static directory
      file:
        path: /var/www/miniapp
        state: directory
        mode: '0755'

    - name: Create miniapp source directory
      file:
        path: /var/www/novanet/miniapp-source
        state: directory
        mode: '0755'

    - name: Configure ufw — allow SSH
      ufw:
        rule: allow
        name: OpenSSH

    - name: Configure ufw — allow HTTP
      ufw:
        rule: allow
        port: '80'
        proto: tcp

    - name: Configure ufw — allow HTTPS
      ufw:
        rule: allow
        port: '443'
        proto: tcp

    - name: Enable ufw
      ufw:
        state: enabled
        policy: deny

    - name: Enable and start nginx
      systemd:
        name: nginx
        enabled: yes
        state: started

    - name: Set up PM2 to start on boot
      shell: pm2 startup systemd -u root --hp /root
      args:
        creates: /etc/systemd/system/pm2-root.service
