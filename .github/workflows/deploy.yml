name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: production-dashboard-deploy
  cancel-in-progress: false

# Production backend and Mini App are deployed to the DigitalOcean Droplet with
# Ansible/PM2/Nginx. This workflow intentionally deploys only the two dashboards
# that still live on Cloudflare Pages.

jobs:
  deploy-admin:
    name: Deploy Admin Dashboard to Cloudflare Pages
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-dashboard/package-lock.json
      - run: npm ci
        working-directory: admin-dashboard
      - run: npm run build
        working-directory: admin-dashboard
        env:
          # Dashboard production builds must target the Droplet backend.
          # Do not use the retired DigitalOcean App Platform URL here.
          VITE_API_BASE_URL: https://api.novanetmm.com/api
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN_ADMIN }}
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: admin-dashboard
          command: pages deploy dist --project-name=novanet-admin

  deploy-reseller:
    name: Deploy Reseller Dashboard to Cloudflare Pages
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: reseller-dashboard/package-lock.json
      - run: npm ci
        working-directory: reseller-dashboard
      - run: npm run build
        working-directory: reseller-dashboard
        env:
          # Dashboard production builds must target the Droplet backend.
          # Do not use the retired DigitalOcean App Platform URL here.
          VITE_API_BASE_URL: https://api.novanetmm.com/api
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN_RESELLER }}
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: reseller-dashboard
          command: pages deploy dist --project-name=novanet-reseller
