name: novanet-backend
region: sgp

services:
  - name: api
    github:
      repo: kyawlinn-dev/vpn-saas-platform
      branch: main
      deploy_on_push: true
    source_dir: /backend
    build_command: npm ci --omit=dev
    run_command: node src/server.js
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xs
    http_port: 3000
    health_check:
      http_path: /api/health
      initial_delay_seconds: 10
      period_seconds: 30
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: NODE_ENV
        value: production
        scope: RUN_AND_BUILD_TIME
      - key: PORT
        value: "3000"
        scope: RUN_AND_BUILD_TIME
      # Add all remaining secrets via the DO App Platform dashboard (encrypted):
      #   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, SUPABASE_ANON_KEY
      #   DIGITALOCEAN_TOKEN, DIGITALOCEAN_REGION, DIGITALOCEAN_SIZE,
      #   DIGITALOCEAN_IMAGE, DIGITALOCEAN_SSH_KEY_FINGERPRINT
      #   SERVER_BOOTSTRAP_SSH_USER, SERVER_BOOTSTRAP_TIMEOUT_MS
      #   BOT_TOKEN_ENCRYPTION_KEY, TELEGRAM_BOT_TOKEN
      #   WEBHOOK_BASE_URL  (set to your .ondigitalocean.app URL after first deploy)
      #   RESELLER_DASHBOARD_URL, ADMIN_DASHBOARD_URL
      #   MINIAPP_URL, TELEGRAM_MINIAPP_URL, CORS_ALLOWED_ORIGINS
      #   PUBLIC_WORKER_BASE_URL, PUBLIC_SUBSCRIPTION_BASE_URL
      #   DEFAULT_SERVER_MAX_ACTIVE_KEYS, DEFAULT_TRIAL_RESELLER_ID
      #
      # SSH key for server provisioning:
      #   SERVER_BOOTSTRAP_PRIVATE_KEY_PATH is a local path — provisioning new
      #   Droplets must still be triggered from a machine with the key, or store
      #   the key content in a secret env var and adapt sshService.js to read it.
